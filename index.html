<!DOCTYPE html>
<html lang="vi" data-theme="spotify">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Vibe Music Ultra</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MQTT.js & YouTube API -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
    
    <style>
        /* ================= THEMES ================= */
        /* 1. Spotify Dark (Default) */
        :root {
            --bg-base: #0a0a0a;
            --bg-surface: #171717;
            --bg-elevated: #262626;
            --primary: #1ed760;
            --primary-hover: #1db954;
            --text-main: #ffffff;
            --text-muted: #a3a3a3;
            --danger: #ef4444;
            --player-height: 90px;
        }

        /* 2. Cyberpunk Neon */
        [data-theme="cyberpunk"] {
            --bg-base: #050510;
            --bg-surface: #10102a;
            --bg-elevated: #1a1a40;
            --primary: #ff00ff;
            --primary-hover: #cc00cc;
            --text-main: #00ffff;
            --text-muted: #8a8aeb;
            --danger: #ff3333;
        }

        /* 3. Light Minimal */
        [data-theme="light"] {
            --bg-base: #f9fafb;
            --bg-surface: #ffffff;
            --bg-elevated: #f3f4f6;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --danger: #ef4444;
        }

        /* 4. Soft Pastel */
        [data-theme="pastel"] {
            --bg-base: #fdfbf7;
            --bg-surface: #f4f1ea;
            --bg-elevated: #e8e4db;
            --primary: #ffb7b2;
            --primary-hover: #ff9d96;
            --text-main: #5c5c5c;
            --text-muted: #a0a0a0;
            --danger: #ff8484;
        }

        /* ================= GLOBAL STYLES ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; transition: background-color 0.3s, color 0.3s; }
        
        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: calc(var(--player-height) + 20px);
        }

        .flex { display: flex; } .flex-col { display: flex; flex-direction: column; }
        .items-center { align-items: center; } .justify-between { justify-content: space-between; } .justify-center { justify-content: center; }
        .gap-2 { gap: 8px; } .gap-3 { gap: 12px; } .gap-4 { gap: 16px; }
        .text-center { text-align: center; } .w-full { width: 100%; }
        .mt-4 { margin-top: 16px; } .mb-2 { margin-bottom: 8px; } .mb-4 { margin-bottom: 16px; } .mb-6 { margin-bottom: 24px; }
        .truncate { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .container { width: 100%; max-width: 600px; margin: 0 auto; padding: 20px; }

        h1 { font-size: 2.2rem; font-weight: 800; color: var(--primary); }
        h2 { font-size: 1.5rem; font-weight: 700; }
        h3 { font-size: 1.1rem; font-weight: 600; color: var(--text-muted); }

        /* Inputs & Buttons */
        input {
            width: 100%; background: var(--bg-surface); border: 1px solid var(--bg-elevated);
            color: var(--text-main); padding: 14px 16px; border-radius: 12px; font-size: 1rem; outline: none;
        }
        input:focus { border-color: var(--primary); }

        .btn {
            background: var(--primary); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.2);
            border: none; padding: 12px 20px; border-radius: 12px; font-size: 1rem; font-weight: 700;
            cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
        }
        [data-theme="spotify"] .btn, [data-theme="cyberpunk"] .btn, [data-theme="pastel"] .btn { color: #000; text-shadow: none; }
        
        .btn:hover { background: var(--primary-hover); transform: scale(1.02); }
        .btn:active { transform: scale(0.98); }
        
        .btn-icon {
            background: var(--primary); color: #000; border: none; border-radius: 12px;
            width: 50px; height: 50px; display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; cursor: pointer; flex-shrink: 0;
        }
        [data-theme="light"] .btn-icon { color: #fff; }

        .card {
            background: var(--bg-surface); border-radius: 16px; padding: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--bg-elevated);
        }

        .screen { display: none; animation: fadeUp 0.3s ease forwards; }
        .screen.active { display: block; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Compact Add Song */
        .compact-add {
            display: flex; gap: 8px; background: var(--bg-surface); padding: 10px; 
            border-radius: 16px; border: 1px solid var(--bg-elevated); align-items: center;
            position: sticky; top: 10px; z-index: 50; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .compact-add input { border: none; padding: 10px; background: transparent; }
        .compact-add input:focus { box-shadow: none; }

        /* Song List */
        .song-list { list-style: none; }
        .song-item {
            display: flex; align-items: center; gap: 15px; padding: 10px;
            border-radius: 12px; border-bottom: 1px solid transparent;
        }
        .song-item:hover { background: var(--bg-surface); }
        .song-thumb { width: 50px; height: 50px; border-radius: 8px; object-fit: cover; }
        .song-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 2px; }
        .song-meta { font-size: 0.8rem; color: var(--text-muted); }
        
        .action-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.2rem; cursor: pointer; padding: 5px; }
        .action-btn:hover { color: var(--primary); }
        .action-btn.danger:hover { color: var(--danger); }

        /* Bottom Player */
        .bottom-player {
            position: fixed; bottom: 0; left: 0; right: 0; height: var(--player-height);
            background: var(--bg-elevated); border-top: 1px solid var(--bg-surface);
            display: flex; align-items: center; padding: 0 20px; z-index: 100;
            transform: translateY(100%); transition: transform 0.3s;
        }
        .bottom-player.visible { transform: translateY(0); }
        .player-inner { max-width: 800px; margin: 0 auto; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        .np-thumb { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; }
        .player-controls { display: flex; gap: 15px; align-items: center; }
        .ctrl-btn { background: transparent; border: none; color: var(--text-main); font-size: 1.5rem; cursor: pointer; }
        .ctrl-play { 
            background: var(--text-main); color: var(--bg-base); width: 45px; height: 45px;
            border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 1.2rem; cursor: pointer; border: none;
        }

        /* Video Player Container */
        .video-outer {
            width: 100%;
            height: 0;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .video-outer.active {
            height: auto;
            opacity: 1;
            margin-bottom: 20px;
        }
        .video-wrapper {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
            border: 1px solid var(--bg-elevated);
        }
        #youtube-container { width: 100%; height: 100%; }

        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-100px);
            background: var(--primary); color: #000; padding: 12px 24px; border-radius: 30px;
            font-weight: 700; transition: 0.3s; z-index: 1000; opacity: 0;
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        /* Tabs for Queue vs Library */
        .tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab { padding: 8px 16px; border-radius: 20px; font-weight: 600; cursor: pointer; color: var(--text-muted); border: 1px solid var(--bg-elevated); }
        .tab.active { background: var(--primary); color: #000; border-color: var(--primary); }
        [data-theme="light"] .tab.active { color: #fff; }

        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .theme-selector { display: flex; gap: 10px; justify-content: center; margin-bottom: 20px; }
        .theme-btn { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
        .theme-btn.active { border-color: var(--primary); transform: scale(1.1); }
        .tb-spotify { background: #0a0a0a; } .tb-cyberpunk { background: #050510; } 
        .tb-light { background: #f9fafb; border: 1px solid #ddd; } .tb-pastel { background: #fdfbf7; }

    </style>
</head>
<body>

    <div class="toast" id="toast">Thông báo</div>

    <div class="container">
        
        <!-- ================= LANDING SCREEN ================= -->
        <div id="screen-landing" class="screen active text-center">
            
            <div class="theme-selector mt-4">
                <div class="theme-btn tb-spotify active" onclick="setTheme('spotify')" title="Dark"></div>
                <div class="theme-btn tb-cyberpunk" onclick="setTheme('cyberpunk')" title="Cyberpunk"></div>
                <div class="theme-btn tb-light" onclick="setTheme('light')" title="Light"></div>
                <div class="theme-btn tb-pastel" onclick="setTheme('pastel')" title="Pastel"></div>
            </div>

            <div class="mb-6 mt-2">
                <i class="fa-solid fa-compact-disc fa-spin" style="font-size: 4rem; color: var(--primary); margin-bottom: 15px;"></i>
                <h1>Vibe Music</h1>
                <p style="color: var(--text-muted); font-size: 1rem; margin-top: 5px;">Nghe nhạc chung chất lượng cao</p>
            </div>
            
            <div class="card mb-6 text-left">
                <button class="btn mb-4" onclick="initHost()"><i class="fa-solid fa-tower-broadcast"></i> TẠO PHÒNG PHÁT NHẠC</button>
                <div class="flex items-center gap-3 mb-4">
                    <div style="flex:1; height:1px; background: var(--bg-elevated);"></div>
                    <span style="color: var(--text-muted); font-size: 0.9rem;">THAM GIA PHÒNG</span>
                    <div style="flex:1; height:1px; background: var(--bg-elevated);"></div>
                </div>
                
                <div id="active-rooms-list" style="margin-bottom: 15px;"></div>

                <div class="flex gap-2">
                    <input type="text" id="join-pin" placeholder="Nhập PIN" maxlength="4" style="text-align: center; font-weight: bold; width: 70%;">
                    <button class="btn" style="width: 30%;" onclick="showJoinScreen()"><i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>
        </div>

        <!-- ================= JOIN SCREEN ================= -->
        <div id="screen-join" class="screen">
            <div class="card mt-6">
                <h2 class="mb-4 text-center">Tham Gia Phòng</h2>
                <div class="text-center mb-6">
                    <span style="color: var(--text-muted);">Mã Phòng:</span>
                    <div style="font-size: 2.5rem; font-weight: 800; color: var(--primary); letter-spacing: 5px;" id="join-room-display">...</div>
                </div>
                
                <div class="mb-4">
                    <input type="text" id="join-name" placeholder="Tên hiển thị (VD: DJ Cà Chua)" autofocus>
                </div>

                <button class="btn mb-2" onclick="initGuest()">VÀO PHÒNG NGAY</button>
                <button class="btn" style="background: var(--bg-elevated); color: var(--text-main);" onclick="showScreen('screen-landing')">QUAY LẠI</button>
            </div>
        </div>

        <!-- ================= MAIN DASHBOARD ================= -->
        <div id="screen-dashboard" class="screen">
            
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 style="margin-bottom: 2px;">Phòng <span id="dash-room-id" style="color: var(--primary);">---</span></h2>
                    <div style="font-size: 0.9rem; color: var(--text-muted);">Tên: <span id="dash-my-name">...</span></div>
                </div>
                <div class="flex gap-2">
                    <button class="action-btn" onclick="copyInviteLink()" title="Sao chép link mời"><i class="fa-solid fa-share-nodes"></i></button>
                    <button class="action-btn" onclick="location.href=location.pathname" title="Thoát"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </div>

            <!-- YOUTUBE VIDEO PLAYER -->
            <div id="main-video-wrapper" class="video-outer">
                <div class="video-wrapper">
                    <div id="youtube-container"></div>
                </div>
            </div>

            <!-- COMPACT ADD SONG BAR -->
            <div class="compact-add mb-4">
                <input type="text" id="song-url" placeholder="Dán link YouTube (Tự động nhận tên)..." onpaste="setTimeout(sendSongRequest, 100)">
                <button class="btn-icon" onclick="sendSongRequest()"><i class="fa-solid fa-plus"></i></button>
            </div>

            <!-- TABS: QUEUE & LIBRARY -->
            <div class="tabs">
                <div class="tab active" id="tab-queue" onclick="switchTab('queue')">Hàng Đợi (<span id="queue-count">0</span>)</div>
                <div class="tab" id="tab-library" onclick="switchTab('library')">Yêu Thích (<span id="lib-count">0</span>)</div>
            </div>

            <!-- TAB CONTENT: QUEUE -->
            <div id="content-queue" class="tab-content active mb-6">
                <ul class="song-list" id="queue-list"></ul>
            </div>

            <!-- TAB CONTENT: LIBRARY -->
            <div id="content-library" class="tab-content mb-6">
                <div style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 10px;">Các bài hát bạn đã <i class="fa-solid fa-heart" style="color:var(--danger)"></i> lưu trong trình duyệt.</div>
                <ul class="song-list" id="library-list"></ul>
            </div>
            
            <div class="flex justify-center gap-3 mb-6">
                <button class="action-btn" onclick="sendEmoji('❤️')" style="font-size: 1.5rem;">❤️</button>
                <button class="action-btn" onclick="sendEmoji('🔥')" style="font-size: 1.5rem;">🔥</button>
                <button class="action-btn" onclick="sendEmoji('👏')" style="font-size: 1.5rem;">👏</button>
            </div>
        </div>
    </div>

    <!-- ================= BOTTOM PLAYER BAR ================= -->
    <div class="bottom-player" id="bottom-player">
        <div class="player-inner">
            <div class="flex items-center gap-3" style="flex: 1; min-width: 0;">
                <img src="https://via.placeholder.com/150/171717/333333?text=Vibe" id="player-thumb" class="np-thumb" alt="Thumbnail">
                <div class="flex-col" style="min-width: 0;">
                    <div class="song-title truncate" id="player-title">Chưa phát bài nào</div>
                    <div class="song-meta truncate" id="player-user">Thêm nhạc để bắt đầu</div>
                </div>
            </div>

            <div class="player-controls">
                <button class="action-btn" id="btn-like-current" onclick="likeCurrentSong()" title="Lưu vào Yêu thích"><i class="fa-regular fa-heart"></i></button>
                
                <button class="ctrl-btn" id="btn-vote-skip" onclick="voteSkip()" title="Vote Bỏ Qua" style="display: none;">
                    <i class="fa-solid fa-forward-step"></i> <span id="vote-count" style="font-size: 0.8rem;">0/2</span>
                </button>
                
                <!-- Host Controls -->
                <button class="ctrl-play" id="ctrl-play-pause" onclick="togglePlayPause()" style="display:none;"><i class="fa-solid fa-play"></i></button>
                <button class="ctrl-btn" id="ctrl-next" style="display:none;" onclick="skipSong()"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>
    </div>

    <script>
        // ================= THEME & STORAGE LOGIC =================
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('vibe-theme', theme);
            document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.tb-${theme}`).classList.add('active');
        }
        
        function loadSettings() {
            const savedTheme = localStorage.getItem('vibe-theme') || 'spotify';
            setTheme(savedTheme);
            renderLibrary();
        }
        
        let savedLibrary = JSON.parse(localStorage.getItem('vibe-library') || '[]');

        function likeCurrentSong() {
            if (!currentPlaying) return showToast("Chưa có bài nào đang phát!");
            const exists = savedLibrary.find(s => s.url === currentPlaying.url);
            if (exists) return showToast("Bài này đã có trong Yêu Thích!");
            
            savedLibrary.push({ name: currentPlaying.name, url: currentPlaying.url });
            localStorage.setItem('vibe-library', JSON.stringify(savedLibrary));
            showToast("❤️ Đã lưu vào Yêu Thích!");
            renderLibrary();
        }

        function removeLibrarySong(url) {
            savedLibrary = savedLibrary.filter(s => s.url !== url);
            localStorage.setItem('vibe-library', JSON.stringify(savedLibrary));
            renderLibrary();
        }

        function addFromLibrary(url, name) {
            const song = { name: name, url: url, user: myName, id: Date.now().toString(), skipVotes: [] };
            mqttClient.publish(`vibecoder/lanplayer/${roomID}/requests`, JSON.stringify({ type: 'ADD_SONG', song: song }));
            showToast("Đã thêm từ Yêu Thích!");
            switchTab('queue');
        }

        function renderLibrary() {
            const listEl = document.getElementById('library-list');
            document.getElementById('lib-count').innerText = savedLibrary.length;
            listEl.innerHTML = '';
            
            if (savedLibrary.length === 0) {
                listEl.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding: 20px;">Bạn chưa lưu bài hát nào. Bấm nút ❤️ ở thanh Player để lưu nhé!</div>';
                return;
            }

            savedLibrary.forEach(song => {
                const ytId = extractYTId(song.url);
                const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/default.jpg` : 'https://via.placeholder.com/150';
                listEl.innerHTML += `
                    <li class="song-item">
                        <img src="${thumb}" class="song-thumb" onclick="addFromLibrary('${song.url}', '${song.name}')" style="cursor:pointer;">
                        <div class="song-details" onclick="addFromLibrary('${song.url}', '${song.name}')" style="cursor:pointer;">
                            <div class="song-title truncate">${song.name}</div>
                            <div class="song-meta">Bấm để thêm vào hàng đợi</div>
                        </div>
                        <button class="action-btn danger" onclick="removeLibrarySong('${song.url}')"><i class="fa-solid fa-trash"></i></button>
                    </li>
                `;
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            document.getElementById(`content-${tab}`).classList.add('active');
        }

        // ================= APP LOGIC (MQTT & YT) =================
        const BROKER_URL = 'wss://broker.hivemq.com:8884/mqtt';
        let mqttClient = null; let discoveryClient = null;
        let isHost = false; let roomID = ''; let myName = '';
        let playlist = []; let currentPlaying = null; let isPlaying = false;
        let ytPlayer = null; let ytApiReady = false; let activeRooms = {}; let hostPingInterval = null;

        window.onYouTubeIframeAPIReady = function() { ytApiReady = true; };

        window.onload = () => {
            loadSettings();
            const urlParams = new URLSearchParams(window.location.search);
            const inviteRoom = urlParams.get('room');
            if (inviteRoom) { document.getElementById('join-pin').value = inviteRoom; showJoinScreen(); }
            else { initDiscovery(); }
        };

        function initYTPlayer() {
            if (!ytApiReady || typeof YT === 'undefined') {
                console.warn("YouTube API is not ready yet.");
                return null;
            }
            
            // Re-create the div if it was destroyed by a previous failed YT API call
            let container = document.getElementById('youtube-container');
            if (!container) {
                const wrapper = document.querySelector('.video-wrapper');
                if (wrapper) {
                    container = document.createElement('div');
                    container.id = 'youtube-container';
                    wrapper.appendChild(container);
                }
            }

            return new YT.Player('youtube-container', {
                height: '100%', width: '100%',
                host: 'https://www.youtube.com',
                playerVars: { 
                    'autoplay': isHost?1:0, 
                    'controls': 1, 
                    'disablekb': 1,
                    'enablejsapi': 1,
                    'origin': window.location.protocol === 'file:' ? 'http://localhost' : window.location.origin
                },
                events: {
                    'onStateChange': onPlayerStateChange,
                    'onError': (e) => { 
                        if(isHost) { 
                            showToast("Lỗi video (Bản quyền). Chuyển bài..."); 
                            setTimeout(skipSong, 2000); 
                        } 
                    }
                }
            });
        }

        function onPlayerStateChange(event) {
            if (isHost) {
                if (event.data === YT.PlayerState.ENDED) { currentPlaying = null; isPlaying = false; playNextSong(); }
                else if (event.data === YT.PlayerState.PLAYING) { isPlaying = true; broadcastState(); }
                else if (event.data === YT.PlayerState.PAUSED) { isPlaying = false; broadcastState(); }
            }
        }

        function initDiscovery() {
            discoveryClient = mqtt.connect(BROKER_URL);
            discoveryClient.on('connect', () => { discoveryClient.subscribe('vibecoder/lanplayer/discovery/rooms'); });
            discoveryClient.on('message', (t, msg) => {
                const roomInfo = JSON.parse(msg.toString());
                activeRooms[roomInfo.room] = { ...roomInfo, lastSeen: Date.now() };
                renderActiveRooms();
            });
            setInterval(() => {
                let changed = false;
                for (let r in activeRooms) { if (Date.now() - activeRooms[r].lastSeen > 8000) { delete activeRooms[r]; changed = true; } }
                if (changed) renderActiveRooms();
            }, 5000);
        }

        function renderActiveRooms() {
            const listEl = document.getElementById('active-rooms-list');
            const rooms = Object.values(activeRooms);
            if (rooms.length === 0) { listEl.innerHTML = '<div style="color:var(--text-muted); text-align:center;">Chưa có phòng phát nhạc nào.</div>'; return; }
            listEl.innerHTML = '';
            rooms.forEach(r => {
                listEl.innerHTML += `
                    <div style="background:var(--bg-elevated); padding: 12px; border-radius:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; cursor:pointer;" onclick="joinRoomQuick('${r.room}')">
                        <div><div style="font-weight:700;">${r.hostName}'s Room</div><div style="font-size:0.8rem; color:var(--text-muted);">Đang nghe nhạc</div></div>
                        <div style="background:var(--primary); color:#000; padding:5px 10px; border-radius:20px; font-weight:bold; font-size:0.8rem;">Vào</div>
                    </div>`;
            });
        }

        function joinRoomQuick(pin) { document.getElementById('join-pin').value = pin; showJoinScreen(); }

        function showJoinScreen() {
            let pin = document.getElementById('join-pin').value.trim();
            if(!pin) pin = "Mới";
            document.getElementById('join-room-display').innerText = pin;
            showScreen('screen-join');
        }

        function initHost() {
            isHost = true; roomID = Math.floor(1000 + Math.random()*9000).toString();
            myName = prompt("Tên DJ của bạn?") || "Host";
            setupDashboard();
            if(discoveryClient) discoveryClient.end();
            ytPlayer = initYTPlayer();
            mqttClient = mqtt.connect(BROKER_URL);
            mqttClient.on('connect', () => {
                showToast("Phòng đã mở!");
                mqttClient.subscribe(`vibecoder/lanplayer/${roomID}/requests`);
                hostPingInterval = setInterval(() => mqttClient.publish('vibecoder/lanplayer/discovery/rooms', JSON.stringify({ room: roomID, hostName: myName })), 3000);
            });
            mqttClient.on('message', handleMqttMessage);
        }

        function initGuest() {
            const pin = document.getElementById('join-room-display').innerText.trim();
            const name = document.getElementById('join-name').value.trim();
            if (pin.length !== 4) return alert("Phòng không hợp lệ!");
            roomID = pin; myName = name || 'Khách'; isHost = false;
            setupDashboard();
            if(discoveryClient) discoveryClient.end();
            ytPlayer = initYTPlayer();
            mqttClient = mqtt.connect(BROKER_URL);
            mqttClient.on('connect', () => {
                showToast("Đã vào phòng!");
                mqttClient.subscribe(`vibecoder/lanplayer/${roomID}/state`);
                mqttClient.subscribe(`vibecoder/lanplayer/${roomID}/requests`);
            });
            let lastTimestamp = 0;
            mqttClient.on('message', (t, msg) => {
                const data = JSON.parse(msg.toString());
                if (t.endsWith('/state') && data.timestamp > lastTimestamp) { lastTimestamp = data.timestamp; updateUIState(data); }
                else if (t.endsWith('/requests') && data.type === 'EMOJI') triggerEmoji(data.emoji);
            });
        }

        function setupDashboard() {
            document.getElementById('dash-room-id').innerText = roomID;
            document.getElementById('dash-my-name').innerText = myName;
            if (isHost) {
                document.getElementById('ctrl-play-pause').style.display = 'flex';
                document.getElementById('ctrl-next').style.display = 'block';
            } else {
                document.getElementById('ctrl-play-pause').style.display = 'flex';
                document.getElementById('ctrl-play-pause').innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                document.getElementById('ctrl-play-pause').onclick = forcePlayGuest;
            }
            showScreen('screen-dashboard');
            document.getElementById('bottom-player').classList.add('visible');
        }

        function copyInviteLink() {
            navigator.clipboard.writeText(window.location.origin + window.location.pathname + "?room=" + roomID).then(() => showToast("Đã copy link mời!"));
        }

        function handleMqttMessage(t, msg) {
            if (!isHost) return;
            const data = JSON.parse(msg.toString());
            if (data.type === 'ADD_SONG') {
                playlist.push(data.song); showToast(`${data.song.user} thêm nhạc`);
                if (!currentPlaying) playNextSong(); else { updateHostUI(); broadcastState(); }
            } else if (data.type === 'VOTE_SKIP' && currentPlaying) {
                if (!currentPlaying.skipVotes) currentPlaying.skipVotes = [];
                if (!currentPlaying.skipVotes.includes(data.user)) {
                    currentPlaying.skipVotes.push(data.user);
                    if (currentPlaying.skipVotes.length >= 2) { showToast(`Đang chuyển bài...`); skipSong(); }
                    else { updateHostUI(); broadcastState(); }
                }
            } else if (data.type === 'EMOJI') { triggerEmoji(data.emoji); }
            else if (data.type === 'REMOVE_SONG') { playlist = playlist.filter(s => s.id !== data.id); updateHostUI(); broadcastState(); }
        }

        function fetchYoutubeTitleFast(url) {
            // Lấy ID rồi tạo tên giả vì CORS không cho fetch title tĩnh
            const ytId = extractYTId(url);
            return ytId ? "Bài hát YouTube" : "";
        }

        function sendSongRequest() {
            const url = document.getElementById('song-url').value.trim();
            if (!url) return showToast("Dán link YouTube vào đã bạn ơi!");
            
            const title = fetchYoutubeTitleFast(url) || "Audio / Nhạc";
            const song = { name: title, url: url, user: myName, id: Date.now().toString(), skipVotes: [] };
            mqttClient.publish(`vibecoder/lanplayer/${roomID}/requests`, JSON.stringify({ type: 'ADD_SONG', song: song }));
            
            showToast("✅ Đã thêm!");
            document.getElementById('song-url').value = '';
            switchTab('queue');
        }

        function playNextSong() {
            if (!isHost) return;
            if (playlist.length > 0) {
                currentPlaying = playlist.shift(); currentPlaying.skipVotes = [];
                
                // Trượt khung video ra trước để YT API init mượt mà
                document.getElementById('main-video-wrapper').classList.add('active');
                
                const ytId = extractYTId(currentPlaying.url);
                if (ytId) {
                    if (ytPlayer && ytPlayer.loadVideoById) { 
                        ytPlayer.loadVideoById(ytId); 
                        ytPlayer.playVideo(); 
                    }
                    else { 
                        ytPlayer = initYTPlayer(); 
                        setTimeout(() => { 
                            if(ytPlayer && ytPlayer.loadVideoById) {
                                ytPlayer.loadVideoById(ytId); 
                                ytPlayer.playVideo(); 
                            }
                        }, 1500); 
                    }
                } else { 
                    setTimeout(playNextSong, 1500); 
                    return; 
                }
            } else { 
                currentPlaying = null; 
                isPlaying = false; 
                if(ytPlayer && ytPlayer.stopVideo) ytPlayer.stopVideo(); 
                document.getElementById('main-video-wrapper').classList.remove('active');
            }
            updateHostUI(); broadcastState();
        }

        function skipSong() { if (!isHost) return; if(ytPlayer) ytPlayer.stopVideo(); currentPlaying = null; isPlaying = false; playNextSong(); }

        function togglePlayPause() {
            if (!isHost || !ytPlayer || !currentPlaying) return;
            const state = ytPlayer.getPlayerState();
            if (state === YT.PlayerState.PLAYING) { ytPlayer.pauseVideo(); isPlaying = false; }
            else { ytPlayer.playVideo(); isPlaying = true; }
            updateHostUI(); broadcastState();
        }

        function removeSong(id) { if(isHost) { playlist = playlist.filter(s => s.id !== id); updateHostUI(); broadcastState(); } }

        function voteSkip() {
            if (!roomID || isHost) return;
            mqttClient.publish(`vibecoder/lanplayer/${roomID}/requests`, JSON.stringify({ type: 'VOTE_SKIP', user: myName }));
            document.getElementById('btn-vote-skip').disabled = true;
        }

        function forcePlayGuest() {
            if (ytPlayer && ytPlayer.playVideo && currentPlaying) { ytPlayer.playVideo(); showToast("Đã đồng bộ âm thanh!"); }
        }

        function sendEmoji(emojiChar) {
            if (!roomID) return;
            mqttClient.publish(`vibecoder/lanplayer/${roomID}/requests`, JSON.stringify({ type: 'EMOJI', emoji: emojiChar }));
            if(isHost) triggerEmoji(emojiChar);
        }

        let currentYtId = null;
        function updateHostUI() { renderPlayerBar(currentPlaying, isPlaying); renderQueueList(playlist); }
        
        function updateUIState(data) {
            renderPlayerBar(data.current, data.isPlaying); renderQueueList(data.queue);
            if (data.current) {
                const ytId = extractYTId(data.current.url);
                if (ytId && ytId !== currentYtId) { currentYtId = ytId; if (ytPlayer && ytPlayer.loadVideoById) ytPlayer.loadVideoById(ytId); }
                if (data.isPlaying && ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo();
                else if (!data.isPlaying && ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo();
            } else { if(ytPlayer) ytPlayer.stopVideo(); currentYtId = null; }
        }

        function broadcastState() {
            if (!isHost) return;
            mqttClient.publish(`vibecoder/lanplayer/${roomID}/state`, JSON.stringify({ current: currentPlaying, queue: playlist, isPlaying: isPlaying, timestamp: Date.now() }), {retain: true});
        }

        function renderPlayerBar(song, playing) {
            const titleEl = document.getElementById('player-title'); const userEl = document.getElementById('player-user'); const thumbEl = document.getElementById('player-thumb');
            const btnPlayPause = document.getElementById('ctrl-play-pause'); const btnVoteSkip = document.getElementById('btn-vote-skip');
            const videoWrapper = document.getElementById('main-video-wrapper');
            
            if (song) {
                videoWrapper.classList.add('active');
                titleEl.innerText = song.name; userEl.innerText = `Bởi ${song.user}`;
                const ytId = extractYTId(song.url); thumbEl.src = ytId ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` : 'https://via.placeholder.com/150';
                if(isHost) btnPlayPause.innerHTML = playing ? '<i class="fa-solid fa-pause"></i>' : '<i class="fa-solid fa-play"></i>';
                
                // Trạng thái icon tim
                const isLiked = savedLibrary.find(s => s.url === song.url);
                document.getElementById('btn-like-current').innerHTML = isLiked ? '<i class="fa-solid fa-heart" style="color:var(--danger)"></i>' : '<i class="fa-regular fa-heart"></i>';

                if (!isHost) {
                    btnVoteSkip.style.display = 'block'; const votes = song.skipVotes ? song.skipVotes.length : 0;
                    document.getElementById('vote-count').innerText = `${votes}/2`;
                    btnVoteSkip.disabled = song.skipVotes && song.skipVotes.includes(myName);
                }
            } else {
                videoWrapper.classList.remove('active');
                titleEl.innerText = "Chưa phát bài nào"; userEl.innerText = "Thêm nhạc để bắt đầu";
                thumbEl.src = "https://via.placeholder.com/150/171717/333333?text=Vibe";
                if(isHost) btnPlayPause.innerHTML = '<i class="fa-solid fa-play"></i>';
                btnVoteSkip.style.display = 'none';
            }
        }

        function renderQueueList(q) {
            const listEl = document.getElementById('queue-list'); document.getElementById('queue-count').innerText = q.length;
            if (q.length === 0) { listEl.innerHTML = '<div style="color:var(--text-muted); text-align:center; padding:20px;">Hàng đợi trống. Thêm nhạc nhé!</div>'; return; }
            listEl.innerHTML = '';
            q.forEach((song, idx) => {
                const ytId = extractYTId(song.url); const thumb = ytId ? `https://img.youtube.com/vi/${ytId}/default.jpg` : 'https://via.placeholder.com/150';
                const del = isHost ? `<button class="action-btn danger" onclick="removeSong('${song.id}')"><i class="fa-solid fa-trash"></i></button>` : '';
                listEl.innerHTML += `
                    <li class="song-item">
                        <img src="${thumb}" class="song-thumb">
                        <div class="song-details"><div class="song-title truncate">${song.name}</div><div class="song-meta">Thêm bởi ${song.user}</div></div>
                        ${del}
                    </li>`;
            });
        }

        function showScreen(id) { document.querySelectorAll('.screen').forEach(el => el.classList.remove('active')); document.getElementById(id).classList.add('active'); }
        function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3000); }
        function extractYTId(url) { const m = url.match(/^.*((youtu.be\/)|(v\/)|(\/u\/\w\/)|(embed\/)|(watch\?))\??v?=?([^#&?]*).*/); return (m && m[7].length==11) ? m[7] : false; }
        function triggerEmoji(emoji) {
            const el = document.createElement('div'); el.innerText = emoji; el.className = 'emoji-float';
            el.style.left = (10 + Math.random()*80) + '%'; document.body.appendChild(el); setTimeout(() => el.remove(), 3000);
        }

    </script>
</body>
</html>
